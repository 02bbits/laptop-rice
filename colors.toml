# Ink
# A monochrome dark theme with wine red accent
# Documentation only — nothing reads this. Mirrored by hand into:
# waybar/ink/colors.css, swaync/style.css, rofi/theme.rasi, ghostty/themes/ink,
# niri/config.kdl, swaylock/config.
# ─────────────────────────────────────────────

[Surfaces]
base         = #020305   # app / bar / menu background
surface      = #0e0e0e   # cards, modules
hover        = #1b1b1b   # hover, selected row

[Lines]
border       = #2a2a2a   # borders, inactive rings
divider      = #1f1f1f   # separators

[Text]
text         = #f0ebd8   # primary text
muted        = #a8a8a8   # secondary text
dim          = #6a6a6a   # hints — contrast floor (3.8:1 on base)

[Accent]
# focused window + selected item only, never more than two at once
accent       = #b01949
accent_hover = #c9265a
