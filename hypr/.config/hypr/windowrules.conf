windowrule {
  name = windowrule-1
  suppress_event = maximize
  match:class = .* # You'll probably like this.
}


# Map apps to suitable workspaces
windowrule = match:class ^([Dd]iscord|[Ww]ebCord|[Vv]esktop)$, workspace 10
windowrule = match:class ^(floorp|app.zen_browser.zen|org.mozilla.firefox|one.ablaze.floorp)$, workspace 2
windowrule = match:class ^(Code|jetbrains-idea-ce|jetbrains-idea|dev.zed.Zed|Cursor|jetbrains-pycharm)$, workspace 3
windowrule = match:class ^(obsidian)$, workspace 4
windowrule = match:class ^(pomodorolm)$, workspace 1

# windowrulev2 = float, class:^(gnome-pomodoro)$          # position and size for pomodoro
# windowrulev2 = size 360 484, class:^(gnome-pomodoro)$
# windowrulev2 = move 1400 280, class:^(gnome-pomodoro)$
# windowrulev2 = noanim, class:^(gnome-pomodoro)$
#
# windowrulev2 = float, title:^(peaclocks)(.*)$
# windowrulev2 = size 498 337, title:^(peaclocks)(.*)$

# focus rofi
windowrule {
  name = windowrule-2
  stay_focused = on
  match:class = (Rofi)
}


# custom fix size / float
windowrule = match:class org.gnome.Calendar, float on
windowrule = match:class org.gnome.Calendar, size 60% 60%
# windowrule = match:class ^(thunar|nemo|org.kde.dolphin|org.kde.ark)$, float on
windowrule = match:class ^(blueman-manager), float on
windowrule = match:class ^(thunar|org.kde.dolphin|nemo)$, size 900 650
windowrule = match:class ^(thunar|org.kde.dolphin|nemo)$, center on
windowrule = match:class protonvpn-app, size 400 500
#windowrulev2 = noborder, focus:0
windowrule = match:title ^(jpeg bitmap image import)$, float on

# Pin floating video
windowrule {
  name = windowrule-3
  float = on
  pin = on
  match:title = ^(Picture in picture)$
}


windowrule {
  name = windowrule-4
  float = on
  match:class = org.gnome.FileRoller
}

windowrule {
  name = windowrule-5
  float = on
  match:title = title ^(Figure \d+)$
  match:class = (python3)
}

windowrule {
  name = windowrule-6
  float = on
  match:class = (xdg-desktop-portal-gtk|org.freedesktop.impl.portal.desktop.kde)
}


# Fix Asprite no tiling
windowrule {
  name = windowrule-7
  tile = on
  match:class = Aseprite
}
