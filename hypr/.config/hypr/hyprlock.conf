input-field {
    monitor =
    size = 250, 50
    outline_thickness = 3

    dots_size = 0.26
    dots_spacing = 0.64
    dots_center = true
    dots_rouding = 0

    rounding = 22
    outer_color = rgba(23, 22, 23, 1.0)
    inner_color = rgba(0, 0, 0, 1.0)
    font_color = rgba(238, 236, 227, 1.0)
    fade_on_empty = true
    placeholder_text = <i>secret...</i>

    position = 0, 120
    halign = center
    valign = bottom
}
