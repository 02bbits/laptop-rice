background {
    monitor =
    color = rgba(0,0,0,0.95)
    blur_passes = 90
    blur_size = 100
    # noise = 0.317
    # contrast = 1.3000
    # brightness = 0.1000
    # vibrancy = 0.2100
    # vibrancy_darkness = 1.0
}

# Hours
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%H") </big></b>"
    color = rgba(62, 46, 138, 1.0)
    font_size = 112
    font_family = Typedeer Mono 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 220
    halign = center
    valign = center
}

# Minutes
label {
    monitor =
    text = cmd[update:1000] echo "<b><big> $(date +"%M") </big></b>"
    color = rgba(62, 46, 138, 1.0)
    font_size = 112
    font_family = Typedeer Mono 10
    shadow_passes = 3
    shadow_size = 4

    position = 0, 80
    halign = center
    valign = center
}

# Today
label {
    monitor =
    text = cmd[update:18000000] echo "<b><big> "$(date +'%A')" </big></b>"
    color = rgba(238, 236, 227, 1.0)
    font_size = 22
    font_family = FiraCode Nerd Font 10

    position = 0, -10
    halign = center
    valign = center
}

# Week
label {
    monitor =
    text = cmd[update:18000000] echo "<b> "$(date +'%d %b')" </b>"
    color = rgba(238, 236, 227, 1.0)
    font_size = 18
    font_family = FiraCode Nerd Font 10

    position = 0, -45
    halign = center
    valign = center
}

